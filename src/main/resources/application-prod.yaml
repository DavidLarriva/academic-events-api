spring:
  datasource:
    # Render (PostgreSQL gestionado) no entrega un JDBC URL listo, solo
    # host/puerto/nombre de base por separado (o un connectionString estilo
    # "postgres://..." que el driver JDBC de Postgres no acepta tal cual) —
    # se compone acá. DB_USERNAME/DB_PASSWORD se mantienen tal como los pide
    # docs/instrucciones.md §16 (decisión acordada con el usuario, ver
    # docs/deploy-render.md). Para otros entornos (systemd, Docker Compose
    # manual, etc.) alcanza con exportar DB_HOST/DB_PORT/DB_NAME igual.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  # PORT sí mantiene fallback: así lo exige docs/instrucciones.md sección 15 para Render
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

cors:
  allowed-origins: ${ALLOWED_ORIGINS}

swagger:
  username: ${SWAGGER_USERNAME}
  password: ${SWAGGER_PASSWORD}
