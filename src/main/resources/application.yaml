spring:
  application:
    name: academic-events-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Todas las columnas temporales son TIMESTAMPTZ (V1__initial_schema_and_data.sql)
        # y el driver de Postgres ya normaliza esas lecturas a UTC sin esto
        # (verificado en runtime), pero se deja explícito para no depender
        # implícitamente de ese comportamiento del driver ni de la zona
        # horaria por defecto de la JVM donde corra la app (docs/instrucciones.md §14).
        jdbc:
          time_zone: UTC
  data:
    redis:
      timeout: 2000ms

server:
  servlet:
    context-path: /api
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    # Inyecta el correlationId (CorrelationIdFilter) en todas las líneas de
    # log de una request, para poder cruzarlas con audit_logs.correlation_id
    # sin reemplazar el patrón por defecto de Spring Boot.
    level: "%5p [%X{correlationId}]"
