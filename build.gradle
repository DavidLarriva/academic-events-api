plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ec.edu.ups.icc.dlarriva.msinchi'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-database-postgresql'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'

	// JWT (HS256) - https://github.com/jwtk/jjwt
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// Rate limiting: AOP para el aspecto @RateLimit (el contador en sí usa
	// RedisKeyService/INCR+EXPIRE, no Bucket4j — ver security/ratelimit/).
	// spring-boot-starter-aop no existe para Boot 4 (descontinuado tras la
	// 4.0.0-M2); AopAutoConfiguration solo necesita aspectjweaver en el
	// classpath (spring-aop ya viene transitivamente con Spring Security).
	implementation 'org.aspectj:aspectjweaver'

	// Documentación OpenAPI / Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// Reportes: Excel y PDF
	implementation 'org.apache.poi:poi-ooxml:5.5.1'
	// OpenPDF 3.x compila a bytecode Java 21 (class file 65) y no puede
	// usarse con el toolchain Java 17 del proyecto ("cannot access ...:
	// class file has wrong version 65.0, should be 61.0"); 2.0.5 sí compila
	// para Java 17 y mantiene el paquete clásico com.lowagie.text.
	implementation 'com.github.librepdf:openpdf:2.0.5'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Integration tests (@SpringBootTest) contra Postgres real efímero, no H2:
	// el V1__initial_schema_and_data.sql del profesor usa tipos/constraints
	// específicos de Postgres (TIMESTAMPTZ, triggers) que H2 no replica fielmente
	// (decisión acordada con el usuario). Versiones gestionadas por el BOM de
	// Spring Boot (io.spring.dependency-management), sin fijarlas a mano.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	// Testcontainers 2.x (gestionado por el BOM de Spring Boot 4.0.7, sin fijar
	// versión a mano) renombró los módulos sueltos con prefijo "testcontainers-"
	// (antes "org.testcontainers:junit-jupiter"/"...:postgresql" en la serie 1.x).
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'com.jayway.jsonpath:json-path'
}

tasks.named('test') {
	useJUnitPlatform()
}
